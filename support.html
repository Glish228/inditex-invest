<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDITEX - Support</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
</head>
<body>

  <!-- TOPBAR -->
  <div class="topbar">
    <a href="profile.html" style="color:var(--gray); font-size:22px;">
      <i class="ri-arrow-left-line"></i>
    </a>
    <div class="topbar-logo" style="font-size:18px;">INDI<span>TEX</span></div>
    <a href="https://t.me/inditexofficiel" target="_blank"
      style="color:#29b6f6; font-size:22px;">
      <i class="ri-telegram-fill"></i>
    </a>
  </div>

  <div class="page" style="padding-bottom:140px;">
    <div class="container">

      <div class="section-title">Support Client</div>

      <!-- Info -->
      <div class="alert alert-info show" style="margin-bottom:16px;">
        <i class="ri-information-line"></i>
        Écrivez-nous, nous répondons dans les plus brefs délais.
        Vous pouvez aussi nous rejoindre sur
        <a href="https://t.me/inditexofficiel" target="_blank"
          style="color:var(--primary); font-weight:700;">Telegram</a>.
      </div>

      <!-- Chat -->
      <div class="chat-box" id="chatBox">
        <div style="text-align:center; color:var(--gray); font-size:13px; padding:20px;">
          <i class="ri-customer-service-2-line" style="font-size:32px; display:block; margin-bottom:8px;"></i>
          Chargement des messages...
        </div>
      </div>

    </div>
  </div>

  <!-- Zone de saisie fixe en bas -->
  <div style="position:fixed; bottom:64px; left:0; right:0;
    background:rgba(10,10,20,0.98); backdrop-filter:blur(12px);
    border-top:1px solid var(--border); padding:12px 16px; z-index:99;">
    <div style="max-width:480px; margin:0 auto; display:flex; gap:10px; align-items:flex-end;">
      <textarea id="msgInput" placeholder="Écrivez votre message..."
        rows="1" style="flex:1; background:var(--dark3); border:1.5px solid var(--border);
        border-radius:20px; padding:12px 16px; color:var(--white); font-size:14px;
        resize:none; font-family:inherit; line-height:1.4; max-height:100px;
        overflow-y:auto;"></textarea>
      <button onclick="sendMessage()" id="sendBtn"
        style="width:44px; height:44px; border-radius:50%;
        background:linear-gradient(135deg,var(--primary),var(--blue));
        border:none; cursor:pointer; display:flex; align-items:center;
        justify-content:center; flex-shrink:0; transition:var(--transition);">
        <i class="ri-send-plane-fill" style="color:white; font-size:18px;"></i>
      </button>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="ri-home-5-line"></i><span>Accueil</span>
    </a>
    <a href="products.html" class="nav-item">
      <i class="ri-store-2-line"></i><span>Investir</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="ri-group-line"></i><span>Équipe</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="ri-user-3-line"></i><span>Moi</span>
    </a>
  </nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/supabase/2.39.7/supabase.umd.min.js"></script>
  <script src="supabase.js"></script>
  <script>
    const user = getSession();
    if (!user) window.location.href = 'login.html';

    let polling = null;

    function formatTime(dateStr) {
      return new Date(dateStr).toLocaleTimeString('fr-FR', {
        hour: '2-digit', minute: '2-digit'
      });
    }

    function formatDate(dateStr) {
      return new Date(dateStr).toLocaleDateString('fr-FR', {
        day: '2-digit', month: 'short'
      });
    }

    function renderMessages(messages) {
      const box = document.getElementById('chatBox');

      if (messages.length === 0) {
        box.innerHTML = `
          <div style="text-align:center; color:var(--gray); font-size:13px; padding:30px 20px;">
            <i class="ri-chat-3-line" style="font-size:36px; display:block; margin-bottom:10px; opacity:0.4;"></i>
            Aucun message. Envoyez-nous votre première question !
          </div>`;
        return;
      }

      let html = '';
      let lastDate = '';

      messages.forEach(msg => {
        const msgDate = formatDate(msg.created_at);
        if (msgDate !== lastDate) {
          html += `
            <div style="text-align:center; margin:12px 0;">
              <span style="font-size:11px; color:var(--gray); background:var(--dark2);
                padding:3px 10px; border-radius:10px;">${msgDate}</span>
            </div>`;
          lastDate = msgDate;
        }

        const isUser = msg.sender === 'user';
        html += `
          <div style="display:flex; flex-direction:column;
            align-items:${isUser ? 'flex-end' : 'flex-start'};">
            <div class="msg ${isUser ? 'msg-user' : 'msg-admin'}">
              ${!isUser ? '<div style="font-size:10px; color:var(--primary); font-weight:700; margin-bottom:4px;">Support INDITEX</div>' : ''}
              ${msg.message}
            </div>
            <div class="msg-time">${formatTime(msg.created_at)}</div>
          </div>`;
      });

      box.innerHTML = html;
      box.scrollTop = box.scrollHeight;

      // Marquer messages admin comme lus
      const unread = messages.filter(m => m.sender === 'admin' && !m.is_read);
      if (unread.length > 0) {
        const ids = unread.map(m => m.id);
        db.from('support_messages')
          .update({ is_read: true })
          .in('id', ids)
          .then(() => {});
      }
    }

    async function loadMessages() {
      const messages = await getSupportMessages(user.id);
      renderMessages(messages);
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text  = input.value.trim();
      if (!text) return;

      const btn = document.getElementById('sendBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="loader" style="width:16px;height:16px;border-width:2px;"></span>';

      input.value = '';
      input.style.height = 'auto';

      const result = await sendSupportMessage(user.id, text);

      btn.disabled = false;
      btn.innerHTML = '<i class="ri-send-plane-fill" style="color:white; font-size:18px;"></i>';

      if (!result.error) loadMessages();
    }

    // Envoi avec Entrée (Shift+Entrée pour saut de ligne)
    document.getElementById('msgInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    document.getElementById('msgInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    // Charger et actualiser toutes les 5 secondes
    loadMessages();
    polling = setInterval(loadMessages, 5000);

    // Arrêter le polling quand on quitte la page
    window.addEventListener('beforeunload', () => clearInterval(polling));
  </script>

</body>
</html>

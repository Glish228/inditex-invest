<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDITEX Admin - Support</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
</head>
<body class="admin-body">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">INDI<span>TEX</span> <small>Admin</small></div>
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-item"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="users.html" class="sidebar-item"><i class="ri-group-line"></i> Utilisateurs</a>
      <a href="withdrawals.html" class="sidebar-item"><i class="ri-bank-card-line"></i> Retraits</a>
      <a href="deposits.html" class="sidebar-item"><i class="ri-money-dollar-circle-line"></i> Dépôts</a>
      <a href="support.html" class="sidebar-item active">
        <i class="ri-customer-service-2-line"></i> Support
        <span class="sidebar-badge" id="supportCount" style="display:none;"></span>
      </a>
      <a href="plans.html" class="sidebar-item"><i class="ri-store-2-line"></i> Plans</a>
      <div class="sidebar-item" onclick="adminLogout()" style="cursor:pointer; margin-top:auto; color:var(--danger);">
        <i class="ri-logout-box-line"></i> Déconnexion
      </div>
    </nav>
  </aside>

  <!-- MAIN -->
  <div class="admin-main">
    <div class="admin-topbar">
      <button onclick="toggleSidebar()" class="menu-btn"><i class="ri-menu-line"></i></button>
      <div style="font-size:16px; font-weight:700;">Support Client</div>
      <div style="font-size:13px; color:var(--warning); font-weight:700;" id="unreadCount"></div>
    </div>

    <div class="admin-content" style="padding:0;">
      <div style="display:grid; grid-template-columns:300px 1fr; height:calc(100vh - 60px);">

        <!-- Liste conversations -->
        <div style="border-right:1px solid var(--border); display:flex; flex-direction:column;">
          <div style="padding:16px; border-bottom:1px solid var(--border);">
            <input type="text" class="form-input" id="searchUser"
              placeholder="🔍 Rechercher..." style="font-size:13px; padding:10px 14px;"
              oninput="filterConversations()">
          </div>
          <div style="overflow-y:auto; flex:1;" id="conversationList">
            <div class="admin-empty">Chargement...</div>
          </div>
        </div>

        <!-- Zone chat -->
        <div style="display:flex; flex-direction:column;" id="chatArea">

          <!-- En-tête chat -->
          <div style="padding:16px 20px; border-bottom:1px solid var(--border);
            display:flex; align-items:center; gap:12px;" id="chatHeader">
            <div style="color:var(--gray); font-size:14px;">
              Sélectionnez une conversation
            </div>
          </div>

          <!-- Messages -->
          <div style="flex:1; overflow-y:auto; padding:20px; display:flex;
            flex-direction:column; gap:8px;" id="chatMessages">
          </div>

          <!-- Zone saisie -->
          <div style="padding:16px 20px; border-top:1px solid var(--border);"
            id="chatInput" style="display:none;">
            <div style="display:flex; gap:10px; align-items:flex-end;">
              <textarea id="adminMsgInput" placeholder="Répondre..."
                rows="1" style="flex:1; background:var(--dark3);
                border:1.5px solid var(--border); border-radius:20px;
                padding:12px 16px; color:var(--white); font-size:14px;
                resize:none; font-family:inherit; max-height:100px;
                overflow-y:auto;"></textarea>
              <button onclick="sendAdminMessage()" id="adminSendBtn"
                style="width:44px; height:44px; border-radius:50%;
                background:linear-gradient(135deg,var(--primary),var(--blue));
                border:none; cursor:pointer; display:flex; align-items:center;
                justify-content:center; flex-shrink:0;">
                <i class="ri-send-plane-fill" style="color:white; font-size:18px;"></i>
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script src="../supabase.js"></script>
  <script src="../app.js"></script>
  <script src="admin.js"></script>
  <script>
    checkAdminAuth();

    let allConversations = [];
    let selectedUserId   = null;
    let chatPolling      = null;

    async function loadConversations() {
      // Récupérer tous les users qui ont envoyé au moins un message
      const { data: msgs } = await db
        .from('support_messages')
        .select('user_id, users(full_name, phone, country_code)')
        .order('created_at', { ascending: false });

      if (!msgs) return;

      // Dédupliquer par user_id
      const seen = new Set();
      const conversations = [];
      for (const m of msgs) {
        if (!seen.has(m.user_id)) {
          seen.add(m.user_id);
          conversations.push(m);
        }
      }

      allConversations = conversations;

      // Compter non lus
      const { data: unread } = await db
        .from('support_messages')
        .select('id')
        .eq('sender', 'user')
        .eq('is_read', false);

      const unreadCount = unread?.length || 0;
      document.getElementById('unreadCount').textContent =
        unreadCount > 0 ? `${unreadCount} message(s) non lu(s)` : '';

      const badge = document.getElementById('supportCount');
      if (unreadCount > 0) {
        badge.textContent     = unreadCount;
        badge.style.display   = 'inline-block';
      } else {
        badge.style.display   = 'none';
      }

      renderConversations(conversations);
    }

    function renderConversations(convs) {
      const listEl = document.getElementById('conversationList');
      if (!convs.length) {
        listEl.innerHTML = '<div class="admin-empty">Aucune conversation</div>';
        return;
      }

      listEl.innerHTML = convs.map(c => `
        <div onclick="openConversation('${c.user_id}', '${c.users?.full_name || 'Utilisateur'}')"
          class="conv-item ${selectedUserId === c.user_id ? 'active' : ''}"
          id="conv-${c.user_id}"
          style="padding:14px 16px; cursor:pointer; border-bottom:1px solid var(--border);
          transition:var(--transition); display:flex; align-items:center; gap:10px;
          background:${selectedUserId === c.user_id ? 'rgba(108,60,255,0.1)' : 'transparent'}">
          <div style="width:40px; height:40px; border-radius:50%;
            background:linear-gradient(135deg,var(--primary),var(--blue));
            display:flex; align-items:center; justify-content:center;
            font-weight:900; font-size:16px; flex-shrink:0;">
            ${(c.users?.full_name || 'U').charAt(0).toUpperCase()}
          </div>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:13px; white-space:nowrap;
              overflow:hidden; text-overflow:ellipsis;">
              ${c.users?.full_name || 'Utilisateur'}
            </div>
            <div style="font-size:11px; color:var(--gray);">
              ${c.users?.country_code || ''} ${c.users?.phone || ''}
            </div>
          </div>
        </div>`).join('');
    }

    function filterConversations() {
      const search = document.getElementById('searchUser').value.toLowerCase();
      const filtered = allConversations.filter(c =>
        (c.users?.full_name || '').toLowerCase().includes(search) ||
        (c.users?.phone || '').includes(search)
      );
      renderConversations(filtered);
    }

    async function openConversation(userId, userName) {
      selectedUserId = userId;

      // Mettre à jour header
      document.getElementById('chatHeader').innerHTML = `
        <div style="width:40px; height:40px; border-radius:50%;
          background:linear-gradient(135deg,var(--primary),var(--blue));
          display:flex; align-items:center; justify-content:center;
          font-weight:900; font-size:16px; flex-shrink:0;">
          ${userName.charAt(0).toUpperCase()}
        </div>
        <div>
          <div style="font-weight:700;">${userName}</div>
          <div style="font-size:12px; color:var(--success);">● En ligne</div>
        </div>`;

      // Afficher zone saisie
      document.getElementById('chatInput').style.display = 'block';

      // Marquer conv active visuellement
      document.querySelectorAll('.conv-item').forEach(el => {
        el.style.background = 'transparent';
      });
      const convEl = document.getElementById('conv-' + userId);
      if (convEl) convEl.style.background = 'rgba(108,60,255,0.1)';

      // Charger messages
      await loadChatMessages(userId);

      // Polling
      if (chatPolling) clearInterval(chatPolling);
      chatPolling = setInterval(() => loadChatMessages(userId), 4000);
    }

    async function loadChatMessages(userId) {
      const messages = await getSupportMessages(userId);
      const chatEl   = document.getElementById('chatMessages');

      if (!messages.length) {
        chatEl.innerHTML = `
          <div style="text-align:center; color:var(--gray); padding:40px 20px;">
            <i class="ri-chat-3-line" style="font-size:40px; display:block;
              margin-bottom:10px; opacity:0.3;"></i>
            Aucun message
          </div>`;
        return;
      }

      chatEl.innerHTML = messages.map(m => {
        const isAdmin = m.sender === 'admin';
        const time    = new Date(m.created_at).toLocaleTimeString('fr-FR', {
          hour: '2-digit', minute: '2-digit'
        });
        return `
          <div style="display:flex; flex-direction:column;
            align-items:${isAdmin ? 'flex-end' : 'flex-start'};">
            <div class="msg ${isAdmin ? 'msg-user' : 'msg-admin'}"
              style="${isAdmin ? 'background:var(--primary);' : ''}">
              ${!isAdmin ? '<div style="font-size:10px; color:var(--primary); font-weight:700; margin-bottom:4px;">Client</div>' : ''}
              ${m.message}
            </div>
            <div class="msg-time">${time}</div>
          </div>`;
      }).join('');

      chatEl.scrollTop = chatEl.scrollHeight;

      // Marquer messages user comme lus
      const unread = messages.filter(m => m.sender === 'user' && !m.is_read);
      if (unread.length > 0) {
        await db.from('support_messages')
          .update({ is_read: true })
          .in('id', unread.map(m => m.id));
        loadConversations();
      }
    }

    async function sendAdminMessage() {
      if (!selectedUserId) return;
      const input = document.getElementById('adminMsgInput');
      const text  = input.value.trim();
      if (!text) return;

      const btn = document.getElementById('adminSendBtn');
      btn.disabled = true;
      input.value  = '';

      await db.from('support_messages').insert({
        user_id: selectedUserId,
        message: text,
        sender:  'admin',
        is_read: true
      });

      btn.disabled = false;
      await loadChatMessages(selectedUserId);
    }

    // Envoi avec Entrée
    document.getElementById('adminMsgInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendAdminMessage();
      }
    });

    // Auto-resize textarea
    document.getElementById('adminMsgInput').addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 100) + 'px';
    });

    loadConversations();
    setInterval(loadConversations, 10000);

    window.addEventListener('beforeunload', () => {
      if (chatPolling) clearInterval(chatPolling);
    });
  </script>

</body>
</html>

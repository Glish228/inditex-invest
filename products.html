<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INDITEX - Investir</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
  <style>
    .duration-tabs {
      display: flex; gap: 8px; overflow-x: auto;
      padding-bottom: 8px; margin-bottom: 16px;
      scrollbar-width: none;
    }
    .duration-tabs::-webkit-scrollbar { display: none; }
    .duration-tab {
      flex-shrink: 0; padding: 8px 16px;
      border-radius: 20px; border: 1px solid var(--border);
      background: var(--dark2); color: var(--gray);
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: all 0.2s;
    }
    .duration-tab.active {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }
    .plan-stock {
      position: absolute; top: 12px; right: 12px;
      background: rgba(0,0,0,0.6); border-radius: 20px;
      padding: 4px 10px; font-size: 11px; font-weight: 700;
    }
    .plan-stock.low { color: #f87171; }
    .plan-stock.ok  { color: #86efac; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">INDI<span>TEX</span></div>
    <div style="color:var(--gray); font-size:13px; font-weight:600;">Nos Plans</div>
  </div>

  <div class="page">
    <div class="container">

      <!-- 2 Portefeuilles -->
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;">
        <div class="wallet-card">
          <div class="wallet-label">💳 Dépôt</div>
          <div class="wallet-amount" id="depositBalance">0 F</div>
          <div class="wallet-sub">Pour acheter un plan</div>
        </div>
        <div class="wallet-card" style="background:linear-gradient(135deg,#1a3a2a,#0d2018);
          border-color:var(--success);">
          <div class="wallet-label">🏦 Retrait</div>
          <div class="wallet-amount" id="withdrawalBalance">0 F</div>
        </div>
      </div>

      <!-- Bouton Déposer -->
      <a href="deposit.html" class="btn btn-primary"
        style="display:flex; align-items:center; justify-content:center;
               gap:8px; margin-bottom:20px; padding:14px;">
        <i class="ri-add-circle-line"></i> Déposer des fonds
      </a>

      <div class="alert alert-danger"  id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <!-- Plan Fixe -->
      <div class="section-title">Plan Fixe</div>
      <div id="fixedPlanContainer"></div>

      <!-- Plans Courts -->
      <div class="section-title" style="margin-top:24px;">
        Plans à Courte Durée
      </div>

      <div id="shortPlansLocked" class="alert alert-info show" style="margin-bottom:16px;">
        <i class="ri-information-line"></i>
        Activez d'abord votre compte avec le plan fixe.
      </div>

      <!-- Onglets durée -->
      <div class="duration-tabs" id="durationTabs" style="display:none;"></div>

      <!-- Cards plans courts -->
      <div id="shortPlansGrid"></div>

    </div>
  </div>

  <!-- MODAL ACHAT -->
  <div class="modal-overlay" id="buyModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modalTitle">Confirmer l'achat</div>

      <div class="card" style="margin-bottom:16px;">
        <div class="d-flex align-center justify-between mb-8">
          <span style="color:var(--gray); font-size:13px;">Plan</span>
          <span style="font-weight:700;" id="modalPlanName">-</span>
        </div>
        <div class="d-flex align-center justify-between mb-8">
          <span style="color:var(--gray); font-size:13px;">Montant</span>
          <span style="font-weight:700; color:var(--primary);" id="modalPrice">-</span>
        </div>
        <div class="d-flex align-center justify-between mb-8">
          <span style="color:var(--gray); font-size:13px;">Durée</span>
          <span style="font-weight:700;" id="modalDuration">-</span>
        </div>
        <div class="d-flex align-center justify-between mb-8">
          <span style="color:var(--gray); font-size:13px;">Gain</span>
          <span style="font-weight:700; color:var(--success);" id="modalGain">-</span>
        </div>
        <div class="d-flex align-center justify-between mb-8">
          <span style="color:var(--gray); font-size:13px;">Total reçu</span>
          <span style="font-weight:700;" id="modalTotal">-</span>
        </div>
        <div class="d-flex align-center justify-between"
          id="modalBonusRow" style="display:none!important;">
          <span style="color:var(--gray); font-size:13px;">🎉 Bonus</span>
          <span style="font-weight:700; color:var(--warning);" id="modalBonus">-</span>
        </div>
      </div>

      <!-- Solde dépôt -->
      <div style="background:rgba(108,60,255,0.08); border:1px solid var(--primary);
        border-radius:var(--radius); padding:12px; margin-bottom:16px;
        display:flex; align-items:center; justify-content:space-between;">
        <span style="font-size:13px; color:var(--gray);">💳 Solde dépôt</span>
        <span style="font-weight:700;" id="modalDepositBalance">0 F</span>
      </div>

      <div class="alert alert-danger" id="modalAlert"></div>

      <div style="display:flex; gap:12px; margin-top:8px;">
        <button class="btn btn-outline" onclick="closeModal()" style="flex:1;">Annuler</button>
        <button class="btn btn-primary" id="confirmBtn"
          onclick="confirmPurchase()" style="flex:2;">
          <i class="ri-check-line"></i> Confirmer
        </button>
      </div>

      <a href="deposit.html" id="depositLink"
        style="display:none; text-align:center; margin-top:12px;
               color:var(--primary); font-size:13px; font-weight:600;">
        <i class="ri-add-circle-line"></i> Déposer des fonds
      </a>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="ri-home-5-line"></i><span>Accueil</span>
    </a>
    <a href="products.html" class="nav-item active">
      <i class="ri-store-2-line"></i><span>Investir</span>
    </a>
    <a href="team.html" class="nav-item">
      <i class="ri-group-line"></i><span>Équipe</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="ri-user-3-line"></i><span>Moi</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script>
    const user = getSession();
    if (!user) window.location.href = 'login.html';

    let allPlans       = [];
    let durations      = [];
    let userMyPlans    = [];
    let wallet         = null;
    let userHasFixed   = false;
    let userShortCount = 0;
    let selectedDuration = null;

    // Achat en cours
    let pendingPlan     = null; // objet plan de la base
    let pendingDuration = null; // { duration_days, gain_percent }
    let pendingType     = '';

    async function loadProducts() {
      wallet = await getWallet(user.id);
      if (wallet) {
        document.getElementById('depositBalance').textContent    = formatMoney(wallet.deposit_balance);
        document.getElementById('withdrawalBalance').textContent = formatMoney(wallet.withdrawal_balance);
      }

      allPlans     = await getPlans();
      durations    = await getPlanDurations();
      userMyPlans  = await getUserPlans(user.id);
      userHasFixed = userMyPlans.some(p => p.type === 'fixed');
      userShortCount = userMyPlans.filter(p => p.type === 'short').length;

      renderFixedPlan();
      renderDurationTabs();
    }

    // ── Plan fixe ──────────────────────────────────────────
    function renderFixedPlan() {
      const plan      = allPlans.find(p => p.type === 'fixed');
      const container = document.getElementById('fixedPlanContainer');
      if (!plan) { container.innerHTML = ''; return; }

      if (userHasFixed) {
        container.innerHTML = `
          <div class="card" style="text-align:center; border-color:var(--success);">
            <i class="ri-checkbox-circle-line"
              style="font-size:36px; color:var(--success);"></i>
            <p style="font-weight:700; margin-top:8px;">Plan fixe activé ✓</p>
            <p style="font-size:12px; color:var(--gray); margin-top:4px;">
              Gain : 200 F/jour → portefeuille retrait
            </p>
          </div>`;
        return;
      }

      container.innerHTML = `
        <div class="plan-card" onclick="openFixedModal()" style="position:relative;">
          <div class="plan-card-bg"
            style="background-image:url('${plan.image}')"></div>
          <div class="plan-card-overlay"></div>
          <div class="plan-stock ${plan.stock <= 10 ? 'low' : 'ok'}">
            📦 ${plan.stock} restants
          </div>
          <div class="plan-card-content">
            <div>
              <span class="plan-badge">⭐ PLAN FIXE</span>
              <div class="plan-name">${plan.name}</div>
              <div class="plan-price">${formatMoney(plan.price)}</div>
              <div class="plan-info">
                <div class="plan-info-item">
                  ⏱ <strong>${plan.duration_days} jours</strong>
                </div>
                <div class="plan-info-item">
                  📈 <strong>${formatMoney(plan.daily_gain)}/jour</strong>
                </div>
                <div class="plan-info-item">
                  🎁 Bonus <strong>300 F</strong>
                </div>
              </div>
            </div>
            <button class="plan-btn">
              <i class="ri-shopping-cart-line"></i> Activer le compte
            </button>
          </div>
        </div>`;
    }

    // ── Onglets durée ──────────────────────────────────────
    function renderDurationTabs() {
      const lockedEl = document.getElementById('shortPlansLocked');
      const tabsEl   = document.getElementById('durationTabs');

      if (!userHasFixed) {
        lockedEl.style.display = '';
        tabsEl.style.display   = 'none';
        document.getElementById('shortPlansGrid').innerHTML = '';
        return;
      }

      lockedEl.style.display = 'none';
      tabsEl.style.display   = 'flex';

      tabsEl.innerHTML = durations.map(d => `
        <div class="duration-tab ${selectedDuration?.duration_days === d.duration_days ? 'active' : ''}"
          onclick="selectDuration(${d.duration_days}, ${d.gain_percent})">
          ${d.duration_days}j &nbsp;<span style="font-size:11px; opacity:0.8;">+${d.gain_percent}%</span>
        </div>`).join('');

      if (!selectedDuration && durations.length > 0) {
        selectDuration(durations[0].duration_days, durations[0].gain_percent);
      } else {
        renderShortPlans();
      }
    }

    function selectDuration(days, gainPercent) {
      selectedDuration = { duration_days: days, gain_percent: gainPercent };
      document.querySelectorAll('.duration-tab').forEach((el, i) => {
        el.classList.toggle('active', durations[i]?.duration_days === days);
      });
      renderShortPlans();
    }

    // ── Cards plans courts avec images ────────────────────
    function renderShortPlans() {
      if (!selectedDuration) return;
      const { duration_days, gain_percent } = selectedDuration;
      const isFirstShort = userShortCount === 0;
      const shortPlans   = allPlans.filter(p => p.type === 'short');

      document.getElementById('shortPlansGrid').innerHTML = shortPlans.map(plan => {
        const gainAmt = plan.price * (gain_percent / 100);
        const total   = Number(plan.price) + gainAmt;

        // Vérifier si déjà actif (même plan)
        const activeSame = userMyPlans.filter(
          p => p.plan_id === plan.id && p.type === 'short' && p.status === 'active'
        );
        const totalBought = userMyPlans.filter(
          p => p.plan_id === plan.id && p.type === 'short'
        ).length;

        const isActiveNow  = activeSame.length > 0;
        const maxReached   = totalBought >= (plan.max_per_user || 2);
        const noStock      = plan.stock <= 0;
        const locked       = isActiveNow || maxReached || noStock;

        let lockMsg = '';
        if (isActiveNow)  lockMsg = '⏳ Plan actif';
        if (maxReached)   lockMsg = '✗ Limite atteinte';
        if (noStock)      lockMsg = '✗ Épuisé';

        let bonusHtml = '';
        if (isFirstShort && !locked) {
          const bonus = plan.price <= 10000 ? 500 : 750;
          bonusHtml = `<div class="plan-info-item">🎉 Bonus <strong>${formatMoney(bonus)}</strong></div>`;
        }

        return `
          <div class="plan-card"
            style="margin-bottom:16px; position:relative;
              ${locked ? 'opacity:0.55; filter:grayscale(0.5);' : 'cursor:pointer;'}"
            ${locked ? '' : `onclick="openShortModal('${plan.id}')"`}>
            <div class="plan-card-bg"
              style="background-image:url('${plan.image}')"></div>
            <div class="plan-card-overlay"></div>
            <div class="plan-stock ${plan.stock <= 5 ? 'low' : 'ok'}">
              📦 ${plan.stock}
            </div>
            <div class="plan-card-content">
              <div>
                <span class="plan-badge">🚀 ${duration_days} JOURS</span>
                <div class="plan-name">${plan.name}</div>
                <div class="plan-price">${formatMoney(plan.price)}</div>
                <div class="plan-info">
                  <div class="plan-info-item">
                    📈 +${gain_percent}% (<strong>${formatMoney(gainAmt)}</strong>)
                  </div>
                  <div class="plan-info-item">
                    💰 Total <strong>${formatMoney(total)}</strong>
                  </div>
                  ${bonusHtml}
                </div>
              </div>
              <button class="plan-btn" ${locked ? 'disabled' : ''}>
                ${locked
                  ? `<i class="ri-lock-line"></i> ${lockMsg}`
                  : '<i class="ri-shopping-cart-line"></i> Investir'}
              </button>
            </div>
          </div>`;
      }).join('');
    }

    // ── Modals ─────────────────────────────────────────────
    function openFixedModal() {
      const plan = allPlans.find(p => p.type === 'fixed');
      if (!plan) return;
      pendingType     = 'fixed';
      pendingPlan     = plan;
      pendingDuration = null;

      document.getElementById('modalTitle').textContent     = 'Activer le plan fixe';
      document.getElementById('modalPlanName').textContent  = plan.name;
      document.getElementById('modalPrice').textContent     = formatMoney(plan.price);
      document.getElementById('modalDuration').textContent  = plan.duration_days + ' jours';
      document.getElementById('modalGain').textContent      = formatMoney(plan.daily_gain) + '/jour';
      document.getElementById('modalTotal').textContent     =
        formatMoney(plan.daily_gain * plan.duration_days) + ' total';
      document.getElementById('modalBonus').textContent     = '+ 300 F';
      document.getElementById('modalBonusRow').style.cssText = 'display:flex!important;';
      showModal();
    }

    function openShortModal(planId) {
      if (!userHasFixed) return;
      const plan = allPlans.find(p => p.id === planId);
      if (!plan || !selectedDuration) return;

      pendingType     = 'short';
      pendingPlan     = plan;
      pendingDuration = selectedDuration;

      const { duration_days, gain_percent } = selectedDuration;
      const gainAmt = plan.price * (gain_percent / 100);
      const total   = Number(plan.price) + gainAmt;

      document.getElementById('modalTitle').textContent    = 'Confirmer l\'investissement';
      document.getElementById('modalPlanName').textContent = plan.name;
      document.getElementById('modalPrice').textContent    = formatMoney(plan.price);
      document.getElementById('modalDuration').textContent = duration_days + ' jours';
      document.getElementById('modalGain').textContent     = '+' + gain_percent + '% (' + formatMoney(gainAmt) + ')';
      document.getElementById('modalTotal').textContent    = formatMoney(total);

      const bonusRow = document.getElementById('modalBonusRow');
      if (userShortCount === 0) {
        const bonus = plan.price <= 10000 ? 500 : 750;
        document.getElementById('modalBonus').textContent = '+ ' + formatMoney(bonus);
        bonusRow.style.cssText = 'display:flex!important;';
      } else {
        bonusRow.style.cssText = 'display:none!important;';
      }

      showModal();
    }

    function showModal() {
      document.getElementById('modalDepositBalance').textContent =
        formatMoney(wallet?.deposit_balance || 0);

      const insufficient = !wallet || wallet.deposit_balance < pendingPlan.price;
      document.getElementById('depositLink').style.display =
        insufficient ? 'block' : 'none';
      document.getElementById('confirmBtn').style.display  =
        insufficient ? 'none'  : '';

      document.getElementById('modalAlert').classList.remove('show');
      document.getElementById('buyModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('buyModal').classList.remove('show');
      pendingType = ''; pendingPlan = null; pendingDuration = null;
    }

    document.getElementById('buyModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    async function confirmPurchase() {
      const alertEl = document.getElementById('modalAlert');
      const btn     = document.getElementById('confirmBtn');

      btn.innerHTML = '<span class="loader"></span>';
      btn.disabled  = true;

      let result;
      if (pendingType === 'fixed') {
        result = await buyFixedPlan(user.id, pendingPlan);
      } else {
        result = await buyShortPlan(
          user.id, pendingPlan,
          pendingDuration.duration_days,
          pendingDuration.gain_percent
        );
      }

      btn.innerHTML = '<i class="ri-check-line"></i> Confirmer';
      btn.disabled  = false;

      if (result.error) {
        alertEl.textContent = result.error;
        alertEl.classList.add('show');
        return;
      }

      closeModal();
      const msg = pendingType === 'fixed'
        ? 'Compte activé ! +300 F bonus crédité.'
        : 'Investissement confirmé !';
      document.getElementById('alertSuccess').textContent = msg;
      document.getElementById('alertSuccess').classList.add('show');
      setTimeout(() => {
        document.getElementById('alertSuccess').classList.remove('show');
        loadProducts();
      }, 3000);
    }

    loadProducts();
  </script>

</body>
</html>
